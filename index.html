<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskFlow - To-Do App</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="background-circle circle-one"></div>
<div class="background-circle circle-two"></div>
<main class="todo-container">
<div class="header">
<div>
<p class="small-title">MY PRODUCTIVITY</p>
<h1>Task<span>Flow</span></h1>
</div>
<div class="task-count">
<span id="taskCount">0</span>
<small>Tasks</small>
</div>
</div>
<div class="input-section">
<input type="text" id="taskInput" placeholder="What needs to be done?">
<button id="addButton"><span>+</span>Add Task</button>
</div>
<div class="list-header">
<h2>Today's Tasks</h2>
<span id="completedCount">0 completed</span>
</div>
<ul id="taskList"></ul>
<div id="emptyState" class="empty-state">
<div class="empty-icon">✓</div>
<h3>No tasks yet</h3>
<p>Add your first task and start getting things done.</p>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
